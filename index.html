<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX Vision AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111318;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 14px;
      background: #1b1e25;
      border-bottom: 1px solid #333;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 5px;
      color: #999;
    }

    #chart {
      width: 100%;
      height: 65vh;
    }

    .analysis {
      padding: 15px;
      background: #1b1e25;
      border-top: 1px solid #333;
    }

    .analysis h2 {
      color: #00ff88;
      font-size: 18px;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<header>
  <div class="title">FX Vision AI</div>
  <div class="subtitle">USD / JPY</div>
</header>

<div id="chart">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>

    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
      async>
    {
      "autosize": true,
      "symbol": "FX:USDJPY",
      "interval": "60",
      "timezone": "Asia/Tokyo",
      "theme": "dark",
      "style": "1",
      "locale": "ja",
      "allow_symbol_change": false,
      "hide_top_toolbar": false,
      "hide_legend": false,
      "save_image": false,
      "calendar": false,
      "support_host": "https://www.tradingview.com"
    }
    </script>

  </div>
</div>

<div class="analysis">
  <h2>🤖 AI分析</h2>
  <p>現在はチャート表示の試作品です。</p>
  <p>
    次の段階で、過去の値動きを分析して
    反転候補・サポート・レジスタンスを
    自動表示します。
  </p>
</div>

</body>
</html>
