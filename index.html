<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV診断</title>
</head>

<body style="background:#111;color:white;font-family:sans-serif;padding:20px">

<h2>CSV診断</h2>

<input type="file" id="file" accept=".csv">

<pre id="result" style="white-space:pre-wrap;margin-top:20px"></pre>

<script>

const file =
document.getElementById("file");

const result =
document.getElementById("result");

file.addEventListener("change", function(){

  const selected = this.files[0];

  if(!selected){
    return;
  }

  result.textContent =
  "読み込み開始...\n\n";

  const reader =
  new FileReader();

  reader.onload = function(event){

    try{

      const text =
      event.target.result;

      result.textContent =
      "読み込み成功！\n\n" +
      "文字数: " + text.length +
      "\n\n最初の500文字:\n" +
      text.substring(0,500);

    }catch(error){

      result.textContent =
      "エラー:\n" +
      error.message;

    }

  };

  reader.onerror = function(){

    result.textContent =
    "ファイル自体を読み込めませんでした。";

  };

  reader.readAsText(selected);

});

</script>

</body>
</html>
