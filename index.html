<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX Vision AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>FX Vision AI</h1>
    <p>USD/JPY・自動分析</p>
  </div>

  <div id="marketStatus" class="status">
    待機中
  </div>
</header>


<main>

  <section class="toolbar">

    <button id="loadButton">
      データ更新
    </button>

    <button id="clearLineButton">
      トレンドライン削除
    </button>

  </section>


  <section class="dashboard">

    <div class="card">
      <span>現在値</span>
      <strong id="currentPrice">---</strong>
    </div>

    <div class="card">
      <span>トレンド</span>
      <strong id="trend">---</strong>
    </div>

    <div class="card">
      <span>RSI</span>
      <strong id="rsi">---</strong>
    </div>

    <div class="card">
      <span>判定</span>
      <strong id="decision">---</strong>
    </div>

  </section>


  <!-- 自動分析 -->
  <section class="card analysisCard">

    <h2>自動分析</h2>

    <div class="analysisResult">

      <div class="analysisItem">
        <span>勝率</span>
        <strong id="analysisWinRate">---</strong>
      </div>

      <div class="analysisItem">
        <span>判断</span>
        <strong id="analysisDecision">---</strong>
      </div>

    </div>

    <div class="analysisReason">

      <span>根拠</span>

      <p id="analysisReason">
        データ取得待ち
      </p>

    </div>

  </section>


  <section class="chartCard">

    <div class="chartHeader">

      <strong>USD/JPY</strong>

      <span id="alertMessage">
        待機中
      </span>

    </div>


    <div class="chartArea">

      <div
        id="chartScroll"
        class="chartScroll"
      >

        <canvas
          id="chartCanvas"
        ></canvas>

      </div>


      <div
        id="priceAxis"
        class="priceAxis"
      ></div>

    </div>


    <div class="chartHelp">
      チャートを2回クリックすると
      トレンドラインを設定できます
    </div>

  </section>


  <section class="levels">

    <div class="card">

      <span>サポート</span>

      <strong id="support">
        ---
      </strong>

    </div>


    <div class="card">

      <span>レジスタンス</span>

      <strong id="resistance">
        ---
      </strong>

    </div>

  </section>


  <section class="card">

    <h2>反転候補</h2>

    <div id="signals">
      データ取得待ち
    </div>

  </section>


  <!-- 過去検証は表示を簡略化 -->
  <section class="card">

    <h2>過去検証</h2>

    <div class="backtestGrid">

      <div>
        <span>候補</span>
        <strong id="signalCount">---</strong>
      </div>

      <div>
        <span>成功</span>
        <strong id="winCount">---</strong>
      </div>

      <div>
        <span>失敗</span>
        <strong id="lossCount">---</strong>
      </div>

      <div>
        <span>勝率</span>
        <strong id="winRate">---</strong>
      </div>

    </div>

  </section>

</main>


<script src="signals.js"></script>
<script src="alerts.js"></script>
<script src="chart.js"></script>

</body>
</html>
