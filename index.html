<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FX Vision AI</title>

  <link
    rel="stylesheet"
    href="style.css?v=2"
  >
</head>

<body>

<header class="topbar">

  <div>
    <h1>FX Vision AI</h1>
    <p>USD/JPY・自動分析</p>
  </div>

  <div
    id="marketStatus"
    class="status"
  >
    接続準備中
  </div>

</header>


<main>

  <!-- 操作 -->
  <section class="toolbar">

    <button id="loadButton">
      データ更新
    </button>

    <button id="clearLineButton">
      トレンドライン削除
    </button>

  </section>


  <!-- 基本情報 -->
  <section class="dashboard">

    <div class="card">
      <span>現在値</span>

      <strong id="currentPrice">
        ---
      </strong>
    </div>


    <div class="card">
      <span>トレンド</span>

      <strong id="trend">
        ---
      </strong>
    </div>


    <div class="card">
      <span>RSI</span>

      <strong id="rsi">
        ---
      </strong>
    </div>


    <div class="card">
      <span>判定</span>

      <strong id="decision">
        ---
      </strong>
    </div>

  </section>


  <!-- 自動分析 -->
  <section class="card analysisCard">

    <h2>
      自動分析
    </h2>


    <div class="analysisResult">

      <div class="analysisItem">

        <span>
          勝率
        </span>

        <strong id="analysisWinRate">
          ---
        </strong>

      </div>


      <div class="analysisItem">

        <span>
          判断
        </span>

        <strong id="analysisDecision">
          ---
        </strong>

      </div>

    </div>


    <div class="analysisReason">

      <span>
        根拠
      </span>

      <p id="analysisReason">
        データ取得待ち
      </p>

    </div>

  </section>


  <!-- USD/JPY -->
  <section class="chartCard">

    <div class="chartHeader">

      <strong>
        USD/JPY
      </strong>

      <span id="alertMessage">
        TradingView接続中
      </span>

    </div>


    <div
      class="chartArea"
      style="
        width:100%;
        height:520px;
      "
    >

      <div
        class="tradingview-widget-container"
        style="
          width:100%;
          height:100%;
        "
      >

        <div
          class="tradingview-widget-container__widget"
          style="
            width:100%;
            height:100%;
          "
        ></div>


        <script
          type="text/javascript"
          src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
          async
        >
        {
          "autosize": true,
          "symbol": "FX_IDC:USDJPY",
          "interval": "15",
          "timezone": "Asia/Tokyo",
          "theme": "dark",
          "style": "1",
          "locale": "ja",
          "hide_top_toolbar": false,
          "hide_side_toolbar": false,
          "allow_symbol_change": false,
          "save_image": false,
          "calendar": false,
          "withdateranges": true,
          "hide_volume": true,
          "support_host": "https://www.tradingview.com"
        }
        </script>

      </div>

    </div>


    <div class="chartHelp">

      TradingViewのUSD/JPYチャートを表示しています

    </div>

  </section>


  <!-- サポート・レジスタンス -->
  <section class="levels">

    <div class="card">

      <span>
        サポート
      </span>

      <strong id="support">
        ---
      </strong>

    </div>


    <div class="card">

      <span>
        レジスタンス
      </span>

      <strong id="resistance">
        ---
      </strong>

    </div>

  </section>


  <!-- 反転候補 -->
  <section class="card">

    <h2>
      反転候補
    </h2>

    <div id="signals">
      データ取得待ち
    </div>

  </section>


  <!-- 過去検証 -->
  <section class="card">

    <h2>
      過去検証
    </h2>


    <div class="backtestGrid">

      <div>

        <span>
          候補
        </span>

        <strong id="signalCount">
          ---
        </strong>

      </div>


      <div>

        <span>
          成功
        </span>

        <strong id="winCount">
          ---
        </strong>

      </div>


      <div>

        <span>
          失敗
        </span>

        <strong id="lossCount">
          ---
        </strong>

      </div>


      <div>

        <span>
          勝率
        </span>

        <strong id="winRate">
          ---
        </strong>

      </div>

    </div>

  </section>


  <!-- 旧チャート互換領域 -->
  <div
    id="legacyChart"
    style="display:none;"
  >

    <div
      id="chartScroll"
      class="chartScroll"
    >

      <canvas
        id="chartCanvas"
      ></canvas>

    </div>


    <div
      id="priceAxis"
      class="priceAxis"
    ></div>

  </div>

</main>


<!-- JavaScript -->

<script src="signals.js?v=2"></script>

<script src="alerts.js?v=2"></script>

<script src="chart.js?v=2"></script>


</body>
</html>
