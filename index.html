<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Vision AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101216;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:14px;
  background:#191c22;
  border-bottom:1px solid #333;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.sub{
  color:#999;
  margin-top:5px;
}

#chart{
  width:100%;
  height:55vh;
}

.tradingview-widget-container{
  width:100%;
  height:100%;
}

.panel{
  margin:10px;
  padding:14px;
  background:#191c22;
  border:1px solid #333;
  border-radius:10px;
}

input{
  width:100%;
  margin-top:10px;
}

#result{
  line-height:1.8;
}

.good{
  color:#00e676;
}

.warn{
  color:#ffd54f;
}

.bad{
  color:#ff5252;
}
</style>
</head>

<body>

<header>
  <div class="title">FX Vision AI</div>
  <div class="sub">USD / JPY　1時間足 反転分析</div>
</header>

<div id="chart">

  <div class="tradingview-widget-container">

    <div class="tradingview-widget-container__widget"></div>

    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
      async>
    {
      "autosize":true,
      "symbol":"FX:USDJPY",
      "interval":"60",
      "timezone":"Asia/Tokyo",
      "theme":"dark",
      "style":"1",
      "locale":"ja",
      "allow_symbol_change":false,
      "hide_top_toolbar":false,
      "hide_legend":false,
      "save_image":false,
      "calendar":false,
      "support_host":"https://www.tradingview.com"
    }
    </script>

  </div>

</div>

<div class="panel">

<h2>📊 過去データ分析</h2>

<p>
USD/JPYのCSVファイルを選択してください。
</p>

<input
type="file"
id="csvFile"
accept=".csv,text/csv">

</div>

<div class="panel">

<h2>🎯 分析結果</h2>

<div id="result">
CSVを選択してください。
</div>

</div>


<script>

document
.getElementById("csvFile")
.addEventListener("change",function(event){

  const file=event.target.files[0];

  if(!file){
    return;
  }

  const reader=new FileReader();

  reader.onload=function(){

    try{

      analyzeCSV(reader.result);

    }catch(error){

      document.getElementById("result").innerHTML=
      '<div class="bad">'+
      'CSVの読み込み中にエラーが発生しました。'+
      '</div>';

      console.log(error);

    }

  };

  reader.readAsText(file);

});


function parseCSV(text){

  text=text.replace(/^\uFEFF/,"");

  const lines=text
    .trim()
    .split(/\r?\n/);

  if(lines.length<2){

    return [];

  }


  /*
    カンマまたはタブを自動判定
  */

  const delimiter=
    lines[0].includes("\t")
    ? "\t"
    : ",";


  const headers=lines[0]
    .split(delimiter)
    .map(x =>
      x
      .replace(/^"|"$/g,"")
      .trim()
      .toLowerCase()
    );


  const datetimeIndex=
    headers.findIndex(x =>
      x==="datetime" ||
      x==="date" ||
      x==="timestamp"
    );


  const openIndex=
    headers.indexOf("open");

  const highIndex=
    headers.indexOf("high");

  const lowIndex=
    headers.indexOf("low");

  const closeIndex=
    headers.indexOf("close");


  if(
    openIndex===-1 ||
    highIndex===-1 ||
    lowIndex===-1 ||
    closeIndex===-1
  ){

    throw new Error(
      "open/high/low/close列が見つかりません"
    );

  }


  const data=[];


  for(let i=1;i<lines.length;i++){

    if(!lines[i].trim()){
      continue;
    }


    const columns=lines[i]
      .split(delimiter)
      .map(x =>
        x
        .replace(/^"|"$/g,"")
        .trim()
      );


    const open=parseFloat(
      columns[openIndex]
    );

    const high=parseFloat(
      columns[highIndex]
    );

    const low=parseFloat(
      columns[lowIndex]
    );

    const close=parseFloat(
      columns[closeIndex]
    );


    if(
      Number.isFinite(open) &&
      Number.isFinite(high) &&
      Number.isFinite(low) &&
      Number.isFinite(close)
    ){

      data.push({

        datetime:
          datetimeIndex>=0
          ?columns[datetimeIndex]
          :"",

        open:open,
        high:high,
        low:low,
        close:close

      });

    }

  }


  return data;

}


function analyzeCSV(text){

  const data=parseCSV(text);


  if(data.length<10){

    document.getElementById("result").innerHTML=`

      <div class="bad">

      読み込める価格データがありません。

      </div>

      <p>
      読み込んだ行数：
      ${data.length}
      </p>

    `;

    return;

  }


  let bullish=0;

  let bearish=0;

  let signals=0;

  let lowest=Infinity;

  let highest=-Infinity;


  for(
    let i=1;
    i<data.length-1;
    i++
  ){

    const previous=data[i-1];

    const current=data[i];

    const next=data[i+1];


    /*
      安値反転候補
    */

    if(
      current.low<previous.low &&
      next.close>current.close
    ){

      bullish++;

      signals++;

    }


    /*
      高値反転候補
    */

    if(
      current.high>previous.high &&
      next.close<current.close
    ){

      bearish++;

      signals++;

    }


    if(current.low<lowest){

      lowest=current.low;

    }


    if(current.high>highest){

      highest=current.high;

    }

  }


  document.getElementById("result").innerHTML=`

    <div class="good">
    ✅ CSV読み込み成功
    </div>

    <p>
    データ数：
    <b>${data.length}</b>本
    </p>

    <p>
    🔵 上昇反転候補：
    <b>${bullish}</b>箇所
    </p>

    <p>
    🔴 下落反転候補：
    <b>${bearish}</b>箇所
    </p>

    <p>
    🎯 反転候補合計：
    <b>${signals}</b>箇所
    </p>

    <hr>

    <p>
    最安値：
    <b>${lowest.toFixed(3)}</b>
    </p>

    <p>
    最高値：
    <b>${highest.toFixed(3)}</b>
    </p>

    <hr>

    <p class="warn">
    ⚠️ 現在は試作アルゴリズムです。
    </p>

    <p>
    次の段階で、反転候補がその後どれくらい
    成功したのかを自動検証します。
    </p>

  `;

}

</script>

</body>
</html>
